{% load static portal_tags %}{% if zoom %}<a class="carimg big" href="#photo" title="{% t 'Click to enlarge' %}"><img src="{% static 'portal/cars/' %}{{ v.stock_number }}.jpg?v=3" alt="{{ v.year }} {{ v.make }} {{ v.model }}"><span class="zoomhint">{% t "Click to enlarge" %}</span></a>
<div id="photo" class="lightbox"><a class="lb-bg" href="#" aria-label="{% t 'Close' %}"></a><div class="lb-box"><img src="{% static 'portal/cars/' %}{{ v.stock_number }}.jpg?v=3" alt="{{ v.year }} {{ v.make }} {{ v.model }}"><div class="lb-bar"><b>{{ v.year }} {{ v.make }} {{ v.model }}</b><a class="btn sm" href="#">{% t "Close" %}</a></div></div></div>
{% else %}<a class="carimg" href="/vehicles/{{ v.stock_number }}/"><img src="{% static 'portal/cars/' %}{{ v.stock_number }}.jpg?v=3" alt="{{ v.year }} {{ v.make }} {{ v.model }}" loading="lazy"><span class="lbl">{{ v.year }} {{ v.make }} {{ v.model }}</span></a>{% endif %}
